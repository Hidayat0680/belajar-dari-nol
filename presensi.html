<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presensi TTQ</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f5f7fb;
    color:#1f2937
}

button,
input,
select{
    font:inherit
}

button{
    cursor:pointer
}

.app{
    display:flex;
    min-height:100vh
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:250px;
    background:#fff;
    border-right:1px solid #e8edf2;
    padding:22px 14px;
    z-index:20;
    overflow-y:auto
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 8px 18px
}

.logo-mark{
    width:42px;
    height:52px;
    border:3px solid #087443;
    clip-path:polygon(50% 0,100% 100%,0 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#087443;
    font-size:15px;
    font-weight:900
}

.logo-text strong{
    display:block;
    color:#086b3e;
    font-size:15px;
    line-height:1.1
}

.logo-text small{
    display:block;
    color:#087443;
    font-size:8px;
    font-weight:700;
    margin-top:4px
}

.app-label{
    display:inline-block;
    background:#f1f5f6;
    color:#48bfd2;
    border-radius:18px;
    padding:6px 14px;
    margin:4px 8px 18px;
    font-weight:700;
    font-size:13px
}

.menu a{
    display:flex;
    align-items:center;
    gap:11px;
    color:#4b5563;
    text-decoration:none;
    padding:12px 14px;
    border-radius:14px;
    margin:3px 0;
    font-size:15px;
    font-weight:600;
}

.menu a:hover{
    background:#f0fbfd
}

.menu a.active{
    background:#4dc3d5;
    color:#fff
}

.menu a .arrow{
    margin-left:auto;
    font-size:18px
}

.submenu{
    display:none;
    padding-left:22px
}

.submenu.open{
    display:block
}

.submenu a{
    font-weight:500;
    font-size:14px;
    padding:9px 12px
}

/* MAIN */
.main{
    margin-left:250px;
    min-height:100vh;
    flex:1
}

.topbar{
    height:82px;
    background:#fff;
    border-bottom:1px solid #e7edf2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10
}

.clock{
    display:flex;
    gap:22px;
    font-weight:800;
    font-family:monospace
}

.clock .wis{
    color:#087443
}

.clock .wib{
    color:#f97316
}

.top-actions{
    display:flex;
    align-items:center;
    gap:20px;
    color:#6b7280
}

.avatar{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#263238;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800
}

.content{
    padding:24px
}

.page{
    display:none
}

.page.active{
    display:block
}

.card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 18px rgba(15,23,42,.05);
    border:1px solid #eef1f4
}

/* KARTU DASHBOARD */

.grid{
    display:grid;
    gap:18px
}

.grid-2{
    grid-template-columns:repeat(2,1fr)
}

.stat{
    min-height:145px;
    color:#fff;
    position:relative;
    overflow:hidden
}

.stat.green{
    background:#acd126
}

.stat.blue{
    background:#5058df
}

.stat.red{
    background:#ff5a42
}

.stat.yellow{
    background:#efc43b
}

.stat .icon{
    width:52px;
    height:52px;
    border-radius:16px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    margin-bottom:16px
}

.stat .num{
    font-size:28px;
    font-weight:900
}

.stat .label{
    font-weight:700
}

.dashboard-top{
    display:grid;
    grid-template-columns:1.05fr 1.3fr .95fr;
    gap:18px;
    margin-bottom:18px
}

/* dan seterusnya... */
</style>
</head>
